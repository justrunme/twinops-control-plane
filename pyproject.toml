[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinops"
version = "1.5.1"
description = "GitOps control plane toolkit for industrial digital twins (OpenUSD compiler)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Andrey Lesnikov" }]
keywords = [
  "openusd",
  "digital-twin",
  "gitops",
  "omniverse",
  "platform-engineering",
  "kubernetes",
  "control-plane",
  "industrial",
  "usd",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
live = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "paho-mqtt>=2.1",
]
streaming = [
  "aiortc>=1.9",
  "av>=12.0",
  "numpy>=1.26",
]
usd = [
  "usd-core>=24.5",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "paho-mqtt>=2.1",
  "aiortc>=1.9",
  "av>=12.0",
  "numpy>=1.26",
]

[project.scripts]
twinopsctl = "twinops.cli:main"

[project.urls]
Homepage = "https://justrunme.com/"
Repository = "https://github.com/justrunme/twinops-control-plane"
Issues = "https://github.com/justrunme/twinops-control-plane/issues"
Changelog = "https://github.com/justrunme/twinops-control-plane/blob/main/CHANGELOG.md"
Documentation = "https://github.com/justrunme/twinops-control-plane#readme"
Author = "https://justrunme.com/"
ORCID = "https://orcid.org/0009-0004-7583-4314"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "extensions/twinops_highlight"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
