apiVersion: apps/v1
kind: Deployment
metadata:
  name: twinops-controller-manager
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: twinops-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: twinops-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twinops-operator
    spec:
      serviceAccountName: twinops-controller-manager
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect=false
            - --twinopsctl={{ .Values.twinopsctlPath }}
            - --build-timeout={{ .Values.buildTimeout | default "120s" }}
            - --max-concurrent-reconciles={{ .Values.maxConcurrentReconciles | default 2 }}
            {{- if and (eq (.Values.rbac.mode | default "cluster") "namespaced") }}
            {{- $wn := .Values.rbac.watchNamespaces | default (list) }}
            {{- if eq (len $wn) 0 }}
            - --watch-namespaces={{ .Values.namespace }}
            {{- else }}
            - --watch-namespaces={{ join "," $wn }}
            {{- end }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: TWINOPS_ARTIFACT_ALLOW_PRIVATE
              value: {{ .Values.artifactAllowPrivate | default "0" | quote }}
          volumeMounts:
            - name: workspace
              mountPath: /tmp/twinops
            {{- if .Values.examples.enabled }}
            - name: examples
              mountPath: {{ .Values.examples.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: workspace
          emptyDir: {}
        {{- if .Values.examples.enabled }}
        - name: examples
          hostPath:
            path: {{ .Values.examples.hostPath }}
            type: Directory
        {{- end }}
