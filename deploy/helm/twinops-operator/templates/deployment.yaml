apiVersion: apps/v1
kind: Deployment
metadata:
  name: twinops-controller-manager
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: twinops-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: twinops-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twinops-operator
    spec:
      serviceAccountName: twinops-controller-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - --leader-elect={{ .Values.leaderElect | default false }}
            - --twinopsctl={{ .Values.twinopsctlPath }}
            - --build-timeout={{ .Values.buildTimeout | default "120s" }}
            - --max-concurrent-reconciles={{ .Values.maxConcurrentReconciles | default 2 }}
            {{- if and (eq (.Values.rbac.mode | default "cluster") "namespaced") }}
            {{- $wn := .Values.rbac.watchNamespaces | default (list) }}
            {{- if eq (len $wn) 0 }}
            - --watch-namespaces={{ .Values.namespace }}
            {{- else }}
            - --watch-namespaces={{ join "," $wn }}
            {{- end }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: TWINOPS_ARTIFACT_ALLOW_PRIVATE
              value: {{ .Values.artifactAllowPrivate | default "0" | quote }}
            - name: TWINOPS_ARTIFACT_REQUIRE_URL_DIGEST
              value: {{ .Values.artifactRequireURLDigest | default "0" | quote }}
            - name: TWINOPS_OPERATOR_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            - name: TWINOPS_BUILD_IMAGE
              value: {{ .Values.buildImage | default (printf "%s:%s" .Values.image.repository .Values.image.tag) | quote }}
          volumeMounts:
            # Single emptyDir covers managed workspace /tmp/twinops/<ns>/<uid>.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.examples.enabled }}
            - name: examples
              mountPath: {{ .Values.examples.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.examples.enabled }}
        - name: examples
          hostPath:
            path: {{ .Values.examples.hostPath }}
            type: Directory
        {{- end }}
