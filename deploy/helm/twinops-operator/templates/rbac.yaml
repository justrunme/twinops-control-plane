apiVersion: v1
kind: ServiceAccount
metadata:
  name: twinops-controller-manager
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: twinops-manager-role
rules:
  - apiGroups: ["twinops.io"]
    resources: ["digitaltwins"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["twinops.io"]
    resources: ["digitaltwins/status", "digitaltwins/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: twinops-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: twinops-manager-role
subjects:
  - kind: ServiceAccount
    name: twinops-controller-manager
    namespace: {{ .Values.namespace }}
