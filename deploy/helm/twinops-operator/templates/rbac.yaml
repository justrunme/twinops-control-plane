apiVersion: v1
kind: ServiceAccount
metadata:
  name: twinops-controller-manager
  namespace: {{ .Values.namespace }}
---
{{- $mode := .Values.rbac.mode | default "cluster" -}}
{{- if eq $mode "cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: twinops-manager-role
rules:
  - apiGroups: ["twinops.io"]
    resources: ["digitaltwins"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["twinops.io"]
    resources: ["digitaltwins/status", "digitaltwins/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: twinops-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: twinops-manager-role
subjects:
  - kind: ServiceAccount
    name: twinops-controller-manager
    namespace: {{ .Values.namespace }}
---
# Build Job service account (isolated twinops-job).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: twinops-build
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: twinops-build-role
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: twinops-build-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: twinops-build-role
subjects:
  - kind: ServiceAccount
    name: twinops-build
    namespace: {{ .Values.namespace }}
{{- else if eq $mode "namespaced" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: twinops-manager-leader-election
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: twinops-manager-leader-election
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: twinops-manager-leader-election
subjects:
  - kind: ServiceAccount
    name: twinops-controller-manager
    namespace: {{ .Values.namespace }}
{{- $watch := .Values.rbac.watchNamespaces | default (list) }}
{{- if eq (len $watch) 0 }}
{{- $watch = list .Values.namespace }}
{{- end }}
{{- range $ns := $watch }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: twinops-manager-role
  namespace: {{ $ns }}
rules:
  - apiGroups: ["twinops.io"]
    resources: ["digitaltwins"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["twinops.io"]
    resources: ["digitaltwins/status", "digitaltwins/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: twinops-manager-rolebinding
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: twinops-manager-role
subjects:
  - kind: ServiceAccount
    name: twinops-controller-manager
    namespace: {{ $.Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: twinops-build-role
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: twinops-build-rolebinding
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: twinops-build-role
subjects:
  - kind: ServiceAccount
    name: twinops-build
    namespace: {{ $.Values.namespace }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: twinops-build
  namespace: {{ .Values.namespace }}
{{- else }}
{{- fail (printf "rbac.mode must be cluster or namespaced, got %q" $mode) }}
{{- end }}
