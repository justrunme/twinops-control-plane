namespace: twinops-system

image:
  repository: ghcr.io/justrunme/twinops-operator
  tag: 0.1.0
  pullPolicy: IfNotPresent

replicaCount: 1

twinopsctlPath: /usr/local/bin/twinopsctl

# Mount host examples for demos (kind/k3d local path style).
examples:
  enabled: true
  hostPath: /examples
  mountPath: /examples

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Live API metrics (twinopsctl serve) are scraped separately from the operator.
# When co-locating a live demo Deployment, annotate the Pod with:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "8080"
#   prometheus.io/path: "/metrics"
# JSON form: GET /api/metrics
liveMetrics:
  path: /metrics
  port: 8080
  enabled: false

# Optional sample DigitalTwin CR (demo clusters only).
sampleTwin:
  enabled: false
  name: assembly-line-a
  manifestPath: /examples/assembly-line/twin.yaml
  desiredPath: /examples/assembly-line/desired.yaml
  observedPath: /examples/assembly-line/telemetry.json
  outputDir: /tmp/twinops/assembly-line-a
  intervalSeconds: 30
  # Point at a twinopsctl serve Service to populate status.live
  liveAPIURL: ""
  liveAPIToken: ""
  # Prefer SecretRef over plaintext liveAPIToken outside local demos.
  liveAPITokenSecretRef:
    name: ""
    key: api-token
