namespace: twinops-system
# Prefer Helm --create-namespace; set true only when the chart should own the Namespace object.
createNamespace: false

# RBAC scope: cluster (default) or namespaced (+ watchNamespaces).
rbac:
  mode: cluster
  # When mode=namespaced and empty, only the chart namespace is watched.
  watchNamespaces: []

image:
  repository: ghcr.io/justrunme/twinops-operator
  tag: "1.4.3"
  pullPolicy: IfNotPresent

# Worker image for spec.build.mode=job (defaults to operator image).
# Controlled only via Helm / env — not via DigitalTwin CR (privilege-escalation safe).
buildImage: ""
buildServiceAccountName: twinops-build
# Lab only: allow OCI/S3 → ConfigMap fallback when push tools/backends fail.
allowLabFallback: "0"

replicaCount: 1
# Enable when replicaCount > 1 (requires lease RBAC).
leaderElect: false

twinopsctlPath: /usr/local/bin/twinopsctl

# Subprocess + concurrency guards (single-twin pilot defaults).
buildTimeout: 120s
maxConcurrentReconciles: 2

# Optional hostPath mount for kind/k3d demos. Prefer artifactSource (ConfigMap/URL).
examples:
  enabled: false
  hostPath: /examples
  mountPath: /examples

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

liveMetrics:
  path: /metrics
  port: 8080
  enabled: false

# Optional sample DigitalTwin CR (demo clusters only).
# Prefer artifactSource.configMapName over hostPath manifestPath.
sampleTwin:
  enabled: false
  name: assembly-line-a
  # Legacy filesystem layout (only when examples.enabled=true).
  manifestPath: ""
  desiredPath: ""
  observedPath: ""
  # Legacy field — operator ignores it and uses /tmp/twinops/<ns>/<uid>.
  outputDir: ""
  intervalSeconds: 30
  artifactSource:
    configMapName: ""
    url: ""
  liveAPIURL: ""
  liveAPIToken: ""
  liveAPITokenSecretRef:
    name: ""
    key: api-token
# Lab only: allow private/loopback artifact URLs.
artifactAllowPrivate: "0"
# Fail closed: require expectedDigest when artifactSource.url is set.
artifactRequireURLDigest: "0"
