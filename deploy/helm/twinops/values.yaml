operator:
  enabled: true

# Live API Deployment (works with ghcr.io/justrunme/twinops-live).
# docker-compose remains the fastest local demo; Helm is the cluster path.
live:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/justrunme/twinops-live
    tag: "1.4.1"
    pullPolicy: IfNotPresent
  example: examples/assembly-line
  workDir: /tmp/twinops/live
  service:
    port: 8080
  apiToken: ""
  webrtc: false
  streamingSidecarUrl: ""
  mqtt:
    host: ""
    strictSchema: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Forwarded into the operator subchart when using umbrella install.
# Keep image.tag in sync with Chart.appVersion (asserted by deploy_smoke).
twinops-operator:
  image:
    tag: "1.4.1"
  examples:
    enabled: false
  sampleTwin:
    enabled: false
    liveAPIURL: ""
