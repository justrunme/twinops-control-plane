{{- if .Values.live.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twinops-live
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: twinops-live
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: twinops-live
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twinops-live
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.live.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: twinops-live
          image: "{{ .Values.live.image.repository }}:{{ .Values.live.image.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - twinopsctl
            - serve
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.live.service.port }}"
            - --web-dist
            - web/dist
            {{- if .Values.live.mqtt.host }}
            - --mqtt-host
            - {{ .Values.live.mqtt.host | quote }}
            {{- end }}
            {{- if .Values.live.apiToken }}
            - --api-token
            - {{ .Values.live.apiToken | quote }}
            {{- end }}
          env:
            {{- if .Values.live.mqtt.strictSchema }}
            - name: TWINOPS_MQTT_STRICT_SCHEMA
              value: "1"
            {{- end }}
            {{- if .Values.live.apiToken }}
            - name: TWINOPS_API_TOKEN
              value: {{ .Values.live.apiToken | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.live.service.port }}
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: twinops-live
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: twinops-live
spec:
  selector:
    app.kubernetes.io/name: twinops-live
  ports:
    - name: http
      port: {{ .Values.live.service.port }}
      targetPort: http
{{- end }}
