{{- if .Values.live.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twinops-live
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: twinops-live
    app.kubernetes.io/component: live-api
spec:
  replicas: {{ .Values.live.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: twinops-live
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twinops-live
        app.kubernetes.io/component: live-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.live.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: twinops-live
          image: "{{ .Values.live.image.repository }}:{{ .Values.live.image.tag }}"
          imagePullPolicy: {{ .Values.live.image.pullPolicy | default "IfNotPresent" }}
          # Dockerfile ENTRYPOINT is twinopsctl; args replace CMD only.
          args:
            - serve
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.live.service.port }}"
            - --web-dist
            - web/dist
            - --work-dir
            - {{ .Values.live.workDir | default "/tmp/twinops/live" | quote }}
            {{- if .Values.live.example }}
            - --example
            - {{ .Values.live.example | quote }}
            {{- end }}
            {{- if .Values.live.mqtt.host }}
            - --mqtt-host
            - {{ .Values.live.mqtt.host | quote }}
            {{- end }}
            {{- if .Values.live.streamingSidecarUrl }}
            - --streaming-sidecar
            - {{ .Values.live.streamingSidecarUrl | quote }}
            {{- end }}
            {{- if .Values.live.webrtc }}
            - --webrtc
            {{- end }}
          env:
            {{- if .Values.live.mqtt.strictSchema }}
            - name: TWINOPS_MQTT_STRICT_SCHEMA
              value: "1"
            {{- end }}
            {{- if .Values.live.apiToken }}
            - name: TWINOPS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: twinops-live-api
                  key: api-token
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.live.service.port }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.live.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: twinops-live
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: twinops-live
spec:
  selector:
    app.kubernetes.io/name: twinops-live
  ports:
    - name: http
      port: {{ .Values.live.service.port }}
      targetPort: http
{{- end }}
