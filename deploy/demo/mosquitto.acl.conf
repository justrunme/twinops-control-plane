# Demo Mosquitto ACL profile — lab only.
# Users (see mosquitto.passwd.example):
#   twinops_pub  — may publish factory/#
#   twinops_sub  — may subscribe factory/#
#   twinops_rw   — both

user twinops_pub
topic write factory/#

user twinops_sub
topic read factory/#

user twinops_rw
topic readwrite factory/#
