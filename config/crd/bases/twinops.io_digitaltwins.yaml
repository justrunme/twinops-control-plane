apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: digitaltwins.twinops.io
spec:
  group: twinops.io
  names:
    kind: DigitalTwin
    listKind: DigitalTwinList
    plural: digitaltwins
    shortNames:
      - dtwin
    singular: digitaltwin
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Drift
          type: string
          jsonPath: .status.drift.status
        - name: Live
          type: boolean
          jsonPath: .status.live.ready
        - name: Critical
          type: integer
          jsonPath: .status.drift.critical
        - name: Findings
          type: integer
          jsonPath: .status.drift.findings
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                manifestPath:
                  type: string
                  description: Filesystem path to twin.yaml
                desiredPath:
                  type: string
                observedPath:
                  type: string
                outputDir:
                  type: string
                intervalSeconds:
                  type: integer
                  format: int64
                  default: 30
                twinopsctl:
                  type: string
                liveAPIURL:
                  type: string
                  description: Optional TwinOps live API base URL for status sync
                liveAPIToken:
                  type: string
                  description: Optional bearer token for the live API (demo auth)
                liveAPITokenSecretRef:
                  type: object
                  description: Load bearer token from a Secret (takes precedence over liveAPIToken)
                  required: ["name"]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      description: Secret data key (default api-token)
            status:
              type: object
              properties:
                phase:
                  type: string
                stagePath:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                drift:
                  type: object
                  properties:
                    status:
                      type: string
                    findings:
                      type: integer
                    critical:
                      type: integer
                    warning:
                      type: integer
                    summary:
                      type: string
                    reportPath:
                      type: string
                    lastChecked:
                      type: string
                      format: date-time
                live:
                  type: object
                  description: Optional live API probe summary
                  properties:
                    ready:
                      type: boolean
                    version:
                      type: string
                    twin:
                      type: string
                    hasDrift:
                      type: boolean
                    highlightedPrims:
                      type: integer
                    timelineEvents:
                      type: integer
                    lastSynced:
                      type: string
                      format: date-time
                    message:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
