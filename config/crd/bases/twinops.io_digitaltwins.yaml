apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: digitaltwins.twinops.io
spec:
  group: twinops.io
  names:
    kind: DigitalTwin
    listKind: DigitalTwinList
    plural: digitaltwins
    shortNames:
      - dtwin
    singular: digitaltwin
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Drift
          type: string
          jsonPath: .status.drift.status
        - name: Live
          type: boolean
          jsonPath: .status.live.ready
        - name: Critical
          type: integer
          jsonPath: .status.drift.critical
        - name: Findings
          type: integer
          jsonPath: .status.drift.findings
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                artifactSource:
                  type: object
                  description: Twin inputs (exactly one of configMapName or url); preferred over hostPath
                  x-kubernetes-validations:
                    - rule: "!(has(self.configMapName) && self.configMapName != '' && has(self.url) && self.url != '')"
                      message: "set exactly one of configMapName or url (not both)"
                    - rule: "(has(self.configMapName) && self.configMapName != '') || (has(self.url) && self.url != '')"
                      message: "artifactSource requires configMapName or url"
                  properties:
                    configMapName:
                      type: string
                      description: ConfigMap with twin.yaml (+ optional desired.yaml, telemetry.json)
                    url:
                      type: string
                      description: HTTPS URL to .tar.gz / .zip bundle or twin.yaml
                    expectedDigest:
                      type: string
                      description: Optional sha256 digest of materialized inputs (fail closed on mismatch)
                manifestPath:
                  type: string
                  description: Legacy filesystem path to twin.yaml (hostPath demos)
                desiredPath:
                  type: string
                observedPath:
                  type: string
                outputDir:
                  type: string
                outputPublish:
                  type: object
                  description: Publish composed artifacts to a durable cluster reference
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    mode:
                      type: string
                      enum: [configmap]
                      default: configmap
                outputPublish:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    mode:
                      type: string
                      enum: [configmap, oci, s3]
                      default: configmap
                    keepRevisions:
                      type: integer
                      format: int32
                      default: 5
                      minimum: 1
                      maximum: 50
                    repository:
                      type: string
                    registrySecretRef:
                      type: object
                      properties:
                        name: {type: string}
                        key: {type: string}
                    s3Bucket: {type: string}
                    s3Prefix: {type: string}
                    s3Endpoint: {type: string}
                    s3Region: {type: string}
                    s3PathStyle: {type: boolean}
                    s3SecretRef:
                      type: object
                      properties:
                        name: {type: string}
                        key: {type: string}
                build:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: [inline, job]
                      default: inline
                    activeDeadlineSeconds:
                      type: integer
                      format: int64
                    cpuRequest: {type: string}
                    cpuLimit: {type: string}
                    memoryRequest: {type: string}
                    memoryLimit: {type: string}
                    image: {type: string}
                    serviceAccountName: {type: string}
                intervalSeconds:
                  type: integer
                  format: int64
                  default: 30
                twinopsctl:
                  type: string
                liveAPIURL:
                  type: string
                  description: Optional TwinOps live API base URL for status sync
                liveAPIToken:
                  type: string
                  description: Optional bearer token for the live API (demo auth)
                liveAPITokenSecretRef:
                  type: object
                  description: Load bearer token from a Secret (takes precedence over liveAPIToken)
                  required: ["name"]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      description: Secret data key (default api-token)
            status:
              type: object
              properties:
                phase:
                  type: string
                stagePath:
                  type: string
                artifactDigest:
                  type: string
                  description: sha256 digest of materialized artifact inputs (alias of inputDigest)
                inputDigest:
                  type: string
                  description: sha256 of materialized artifact inputs
                workspacePath:
                  type: string
                  description: Materialized input workspace path
                output:
                  type: object
                  description: Durable published composition reference
                  properties:
                    digest:
                      type: string
                    uri:
                      type: string
                      description: e.g. configmap://namespace/name
                    revision:
                      type: integer
                      format: int64
                    stageKey:
                      type: string
                    mediaType:
                      type: string
                      description: application/vnd.twinops.bundle.v1+tar+gzip
                    bundleKey:
                      type: string
                      description: ConfigMap binaryData key (bundle.tar.gz)
                    publishedAt:
                      type: string
                      format: date-time
                    history:
                      type: array
                      items:
                        type: object
                        properties:
                          revision: {type: integer, format: int64}
                          digest: {type: string}
                          uri: {type: string}
                          inputDigest: {type: string}
                          publishedAt: {type: string, format: date-time}
                build:
                  type: object
                  properties:
                    mode: {type: string}
                    jobName: {type: string}
                    phase: {type: string}
                    message: {type: string}
                lastComposeInputDigest:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                lastComposeGeneration:
                  type: integer
                  format: int64
                drift:
                  type: object
                  properties:
                    status:
                      type: string
                    findings:
                      type: integer
                    critical:
                      type: integer
                    warning:
                      type: integer
                    summary:
                      type: string
                    reportPath:
                      type: string
                    lastChecked:
                      type: string
                      format: date-time
                live:
                  type: object
                  description: Optional live API probe summary
                  properties:
                    ready:
                      type: boolean
                    version:
                      type: string
                    twin:
                      type: string
                    hasDrift:
                      type: boolean
                    highlightedPrims:
                      type: integer
                    timelineEvents:
                      type: integer
                    lastSynced:
                      type: string
                      format: date-time
                    message:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
