# Secrets access is namespaced only (least privilege). Bind this Role in every
# namespace where DigitalTwins may reference tokenSecretRef / liveAPI / publish secrets
# (rbac.secretNamespaces / --secret-namespaces). Twins outside twinops-system require
# an explicit RoleBinding in that twin namespace for the operator ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: twinops-manager-secrets
  namespace: twinops-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: twinops-manager-secrets
  namespace: twinops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: twinops-manager-secrets
subjects:
  - kind: ServiceAccount
    name: twinops-controller-manager
    namespace: twinops-system
