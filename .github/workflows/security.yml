# Supply-chain gate on main/PR when deps or images change (plus manual dispatch).
name: Security

on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "pyproject.toml"
      - "web/package-lock.json"
      - "Dockerfile.*"
      - ".github/workflows/security.yml"
      - "scripts/security_scan.sh"
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "pyproject.toml"
      - "web/package-lock.json"
      - "Dockerfile.*"
      - ".github/workflows/security.yml"
      - "scripts/security_scan.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]" pip-audit==2.10.1
      - name: Audit
        run: python -m pip_audit

  go:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan
        run: govulncheck ./...

  npm:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit
        working-directory: web
        run: npm ci && npm audit --audit-level=high

  images:
    name: Trivy + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build operator image
        run: docker build -f Dockerfile.operator -t twinops-operator:secscan .
      - name: Build live image
        run: docker build -f Dockerfile.live -t twinops-live:secscan .
      - name: Build streaming-sidecar image
        run: docker build -f Dockerfile.streaming-sidecar -t twinops-streaming-sidecar:secscan .
      # docker-run avoids flaky trivy-action binary install (install.sh exit 1 on some runners).
      # Mount .trivyignore when present (only for CVEs with no upstream fix + documented reason).
      # Image digest from Docker Hub multi-arch index for aquasec/trivy:0.66.0.
      - name: Trivy operator
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/.workspace:ro" \
            -w /.workspace \
            aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --scanners vuln \
            twinops-operator:secscan
      - name: Trivy live
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/.workspace:ro" \
            -w /.workspace \
            aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --scanners vuln \
            twinops-live:secscan
      - name: Trivy streaming-sidecar
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/.workspace:ro" \
            -w /.workspace \
            aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --scanners vuln \
            twinops-streaming-sidecar:secscan
      - name: Syft SBOM (operator)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: twinops-operator:secscan
          format: spdx-json
          output-file: twinops-operator.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twinops-sbom
          path: "*.spdx.json"
          if-no-files-found: error
