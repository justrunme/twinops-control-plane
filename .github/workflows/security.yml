# On-demand / release — supply-chain gate (not every PR minute-burn).
name: Security

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "pyproject.toml"
      - "web/package-lock.json"
      - "Dockerfile.*"
      - ".github/workflows/security.yml"
      - "scripts/security_scan.sh"

jobs:
  python:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]" pip-audit
      - name: Audit
        run: python -m pip_audit

  go:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        run: govulncheck ./...

  npm:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit
        working-directory: web
        run: npm ci && npm audit --audit-level=high

  images:
    name: Trivy + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build operator image
        run: docker build -f Dockerfile.operator -t twinops-operator:secscan .
      - name: Build live image
        run: docker build -f Dockerfile.live -t twinops-live:secscan .
      - name: Build streaming-sidecar image
        run: docker build -f Dockerfile.streaming-sidecar -t twinops-streaming-sidecar:secscan .
      # docker-run avoids flaky trivy-action binary install (install.sh exit 1 on some runners).
      - name: Trivy operator
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.66.0 image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            twinops-operator:secscan
      - name: Trivy live
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.66.0 image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            twinops-live:secscan
      - name: Trivy streaming-sidecar
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.66.0 image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            twinops-streaming-sidecar:secscan
      - name: Syft SBOM (operator)
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: twinops-operator:secscan
          format: spdx-json
          output-file: twinops-operator.spdx.json
      - name: Upload SBOM
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: twinops-sbom
          path: "*.spdx.json"
          if-no-files-found: ignore
