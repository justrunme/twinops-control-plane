# On-demand / release-only — avoids burning Actions minutes on every PR.
name: Security

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]" pip-audit
      - name: Audit
        run: python -m pip_audit
