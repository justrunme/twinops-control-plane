name: Publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: git ref / latest)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: justrunme

jobs:
  publish:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: twinops-live
            file: Dockerfile.live
          - name: twinops-operator
            file: Dockerfile.operator
          - name: twinops-streaming-sidecar
            file: Dockerfile.streaming-sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}"
          {
            echo "tag=${TAG}"
            echo "image=${IMAGE}"
            echo "tags=${IMAGE}:${TAG},${IMAGE}:latest"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE}:${TAG}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
