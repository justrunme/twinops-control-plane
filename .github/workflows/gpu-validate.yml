name: GPU validate (manual)

# Run on a self-hosted runner with NVIDIA GPU + driver + ffmpeg h264_nvenc.
# Uploads nvidia-smi, encoder probe, and stream stats as artifacts.
on:
  workflow_dispatch:
    inputs:
      encoder:
        description: "Encoder preference"
        required: true
        default: "auto"
        type: choice
        options: [auto, nvenc, software]

jobs:
  gpu:
    name: Kit NVENC host validation
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Host GPU inventory
        run: |
          mkdir -p /tmp/twinops-gpu-validate
          nvidia-smi | tee /tmp/twinops-gpu-validate/nvidia-smi.txt
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -i nvenc \
            | tee /tmp/twinops-gpu-validate/ffmpeg-nvenc.txt \
            || (echo "h264_nvenc missing" | tee /tmp/twinops-gpu-validate/ffmpeg-nvenc.txt)

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install streaming extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[live,streaming]"

      - name: Encoder probe + short sidecar session
        env:
          TWINOPS_SIDECAR_ENCODER: ${{ inputs.encoder }}
          TWINOPS_SIDECAR_FRAME_SOURCE: kit-file
          TWINOPS_KIT_FRAME_DIR: /tmp/twinops-kit-frames
        run: |
          mkdir -p /tmp/twinops-kit-frames
          python - <<'PY'
          import json, os
          from twinops.streaming_sidecar.encoder import probe_encoder
          cap = probe_encoder(os.environ.get("TWINOPS_SIDECAR_ENCODER", "auto"))
          open("/tmp/twinops-gpu-validate/encoder.json", "w").write(json.dumps(cap.to_dict(), indent=2))
          print(json.dumps(cap.to_dict(), indent=2))
          if os.environ.get("TWINOPS_SIDECAR_ENCODER") == "nvenc" and not cap.nvenc:
              raise SystemExit("nvenc requested but unavailable on host")
          PY
          bash scripts/streaming_sidecar_smoke.sh
          cp "${TMPDIR:-/tmp}/twinops-sidecar-smoke.log" /tmp/twinops-gpu-validate/sidecar-smoke.log || true

      - name: Upload GPU validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gpu-validate
          path: /tmp/twinops-gpu-validate
