name: GPU validate (manual)

# Run on a self-hosted runner with NVIDIA GPU + driver + ffmpeg h264_nvenc.
# Proves NVENC ingest-bridge (not mock) and uploads honest encoder fields + frames.
on:
  workflow_dispatch:
    inputs:
      encoder:
        description: "Encoder preference (nvenc recommended)"
        required: true
        default: "nvenc"
        type: choice
        options: [nvenc, auto]

jobs:
  gpu:
    name: Kit NVENC ingest-bridge validation
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Host GPU inventory
        run: |
          mkdir -p /tmp/twinops-gpu-validate
          nvidia-smi | tee /tmp/twinops-gpu-validate/nvidia-smi.txt
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -i nvenc \
            | tee /tmp/twinops-gpu-validate/ffmpeg-nvenc.txt \
            || (echo "h264_nvenc missing" | tee /tmp/twinops-gpu-validate/ffmpeg-nvenc.txt; exit 1)

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install streaming extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[live,streaming]"

      - name: NVENC ingest-bridge smoke (real offer + track.recv)
        env:
          TWINOPS_SIDECAR_ENCODER: ${{ inputs.encoder }}
          TWINOPS_KIT_FRAME_DIR: /tmp/twinops-kit-frames
        run: |
          mkdir -p /tmp/twinops-kit-frames
          bash scripts/streaming_nvenc_smoke.sh
          cp -a "${TMPDIR:-/tmp}/twinops-nvenc-smoke/." /tmp/twinops-gpu-validate/ || true

      - name: Upload GPU validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-validate
          path: /tmp/twinops-gpu-validate
