name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check python tests

      - name: Test
        run: pytest -q

      - name: Demo build
        run: twinopsctl build examples/assembly-line/twin.yaml --out /tmp/twinops-demo

  go:
    name: Go operator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Python (for twinopsctl integration test)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install twinopsctl
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: Go test / build
        run: |
          go test ./...
          go build -o bin/manager ./cmd/manager
