name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check python tests

      - name: MQTT topic catalog sync
        run: python scripts/sync_mqtt_topics.py --check

      - name: Test
        run: pytest -q

      - name: Demo build
        run: twinopsctl build examples/assembly-line/twin.yaml --out /tmp/twinops-demo

      - name: Drift SARIF sample
        run: |
          twinopsctl build examples/assembly-line/twin.yaml --out examples/assembly-line/generated
          set +e
          twinopsctl drift \
            --desired examples/assembly-line/desired.yaml \
            --stage examples/assembly-line/generated/root.usda \
            --observed examples/assembly-line/telemetry.json \
            --manifest examples/assembly-line/twin.yaml \
            --out /tmp/twinops-drift \
            --sarif /tmp/twinops-drift/drift-report.sarif
          code=$?
          set -e
          # Sample fixtures intentionally contain drift: 0=clean, 1=DRIFT, 3=CRITICAL.
          # Exit 2 (load/tool error) and unexpected codes must fail the job.
          case "$code" in
            0|1|3) ;;
            *) exit "$code" ;;
          esac
          test -f /tmp/twinops-drift/drift-report.sarif

      - name: Upload drift SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-sarif-py${{ matrix.python-version }}
          path: /tmp/twinops-drift/drift-report.sarif

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Live demo smoke
        run: |
          npm --prefix web ci
          npm --prefix web run build
          bash scripts/live_demo.sh --smoke

      - name: End-to-end operational demo
        run: bash scripts/e2e_demo.sh

      - name: Upload E2E demo artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-demo-py${{ matrix.python-version }}
          path: /tmp/twinops-e2e-demo/out
          if-no-files-found: ignore

      - name: Streaming sidecar smoke
        run: bash scripts/streaming_sidecar_smoke.sh

      - name: Software WebRTC integration
        run: pytest -q tests/test_webrtc_software.py

  deploy:
    name: Helm + release containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Deploy smoke
        run: bash scripts/deploy_smoke.sh

  usd:
    name: OpenUSD pxr validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install with usd-core
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,usd]"

      - name: Compose + pxr validate
        run: |
          twinopsctl build examples/assembly-line/twin.yaml --out /tmp/twinops-usd-validate
          python scripts/validate_usd.py /tmp/twinops-usd-validate/root.usda --json

  mqtt:
    name: MQTT publish+ingest smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Mosquitto bridge smoke
        run: bash scripts/mqtt_smoke.sh

      - name: MQTT reliability E2E (OOO/dupe/stale)
        run: bash scripts/mqtt_reliability_e2e.sh

  go:
    name: Go operator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Set up Python (for twinopsctl integration test)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install twinopsctl
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: Setup envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.33.0 -p path)" >> "$GITHUB_ENV"

      - name: Go test / build
        run: |
          go test ./...
          go build -o bin/manager ./cmd/manager

      - name: Controller coverage
        run: |
          go test ./controllers -coverprofile=controllers.out -covermode=atomic
          go tool cover -func=controllers.out | tee controllers-coverage.txt
          pct=$(go tool cover -func=controllers.out | awk '/total:/ {gsub(/%/,"",$3); print $3}')
          echo "controllers coverage=${pct}%"
          awk -v p="$pct" 'BEGIN { if ((p+0) < 60) { print "coverage below 60%: " p; exit 1 } }'

      - name: Upload controller coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controllers-coverage
          path: |
            controllers.out
            controllers-coverage.txt
          if-no-files-found: ignore

  operator-e2e:
    name: Operator artifact E2E (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install twinopsctl (+ usd-core for bundle Stage.Open)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[usd]"

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: twinops-e2e

      - name: Operator ConfigMap artifact E2E
        env:
          TWINOPS_CLUSTER_PROVIDER: kind
          TWINOPS_KIND_CLUSTER: twinops-e2e
        run: bash scripts/operator_artifact_e2e.sh

  operator-plm:
    name: Operator PLM poll E2E (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install twinopsctl (+ usd-core for bundle Stage.Open)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[usd]"

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: twinops-plm-e2e

      - name: Operator PLM revision → output history E2E
        env:
          TWINOPS_CLUSTER_PROVIDER: kind
          TWINOPS_KIND_CLUSTER: twinops-plm-e2e
        run: bash scripts/operator_plm_e2e.sh

  operator-incluster:
    name: Operator in-cluster Helm E2E (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Install twinopsctl (+ usd-core for bundle Stage.Open)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[usd]"

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: twinops-incluster

      - name: In-cluster Helm operator E2E
        env:
          TWINOPS_KIND_CLUSTER: twinops-incluster
          TWINOPS_OPERATOR_IMAGE: twinops-operator:incluster-e2e
        run: bash scripts/operator_incluster_e2e.sh

  operator-job:
    name: Operator Job-mode E2E (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Install twinopsctl
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: twinops-job-e2e

      - name: Job mode input-digest E2E
        env:
          TWINOPS_KIND_CLUSTER: twinops-job-e2e
          TWINOPS_OPERATOR_IMAGE: twinops-operator:job-e2e
        run: bash scripts/operator_job_e2e.sh

  operator-oci-s3:
    name: Operator OCI/S3 E2E (kind + registry + MinIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Install twinopsctl
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: twinops-oci-s3-e2e

      - name: OCI + S3 publish E2E
        env:
          TWINOPS_KIND_CLUSTER: twinops-oci-s3-e2e
          TWINOPS_OPERATOR_IMAGE: twinops-operator:oci-s3-e2e
        run: bash scripts/operator_oci_s3_e2e.sh
