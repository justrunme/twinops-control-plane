name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check python tests

      - name: Test
        run: pytest -q

      - name: Demo build
        run: twinopsctl build examples/assembly-line/twin.yaml --out /tmp/twinops-demo

      - name: Drift SARIF sample
        run: |
          twinopsctl build examples/assembly-line/twin.yaml --out examples/assembly-line/generated
          twinopsctl drift \
            --desired examples/assembly-line/desired.yaml \
            --stage examples/assembly-line/generated/root.usda \
            --observed examples/assembly-line/telemetry.json \
            --manifest examples/assembly-line/twin.yaml \
            --out /tmp/twinops-drift \
            --sarif /tmp/twinops-drift/drift-report.sarif \
            || true
          test -f /tmp/twinops-drift/drift-report.sarif

      - name: Upload drift SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-sarif-py${{ matrix.python-version }}
          path: /tmp/twinops-drift/drift-report.sarif

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Live demo smoke
        run: |
          npm --prefix web ci
          npm --prefix web run build
          bash scripts/live_demo.sh --smoke

  mqtt:
    name: MQTT publish+ingest smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Mosquitto bridge smoke
        run: bash scripts/mqtt_smoke.sh

  go:
    name: Go operator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Set up Python (for twinopsctl integration test)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install twinopsctl
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: Go test / build
        run: |
          go test ./...
          go build -o bin/manager ./cmd/manager
