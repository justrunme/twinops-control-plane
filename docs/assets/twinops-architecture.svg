<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">TwinOps architecture</title>
  <desc id="desc">GitOps control plane: PLM, Git, MQTT into DigitalTwin CR, materialize, isolated build Job, OpenUSD composition, three-way drift, immutable output revisions, optional Kit and Web UI runtimes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="55%" stop-color="#111b30"/>
      <stop offset="100%" stop-color="#0d1528"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2740"/>
      <stop offset="100%" stop-color="#142033"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#16304f"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 800 28px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #f1f5f9; }
      .subtitle { font: 500 13px ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .h { font: 700 13px ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; }
      .t { font: 500 12px ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .s { font: 500 11px ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .tiny { font: 600 10px ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: 0.04em; }
      .chip { font: 700 10px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .flow { fill: none; stroke: #7dd3fc; stroke-width: 2.2; marker-end: url(#arrow); }
      .flowDashed { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5 4; marker-end: url(#arrowMuted); }
      .zone { fill: url(#panel); stroke: #334155; stroke-width: 1.5; }
      .box { fill: #0f1a2d; stroke: #3b536f; stroke-width: 1.5; }
      .boxCore { fill: url(#core); stroke: #38bdf8; stroke-width: 1.8; }
      .boxAccent { fill: #0f1a2d; stroke: #2dd4bf; stroke-width: 1.8; }
      .boxWarn { fill: #1c1917; stroke: #f59e0b; stroke-width: 1.6; }
      .boxOk { fill: #052e1c; stroke: #34d399; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1120" height="720" fill="url(#bg)"/>

  <!-- Header -->
  <text x="40" y="44" class="title">TwinOps architecture</text>
  <text x="40" y="68" class="subtitle">GitOps control plane for industrial digital twins · single-twin production-lean (v1.4)</text>
  <rect x="40" y="82" width="180" height="22" rx="11" fill="url(#accentG)"/>
  <text x="130" y="97" text-anchor="middle" class="chip">control plane · not a 3D dashboard</text>

  <!-- ============ LEFT: Sources ============ -->
  <rect class="zone" x="32" y="120" width="220" height="460" rx="16" filter="url(#soft)"/>
  <text x="52" y="148" class="tiny">SOURCES</text>

  <rect class="box" x="52" y="168" width="180" height="70" rx="12"/>
  <text x="142" y="196" text-anchor="middle" class="h">PLM / ERP</text>
  <text x="142" y="216" text-anchor="middle" class="s">File · REST adapters</text>

  <rect class="box" x="52" y="256" width="180" height="70" rx="12"/>
  <text x="142" y="284" text-anchor="middle" class="h">Git artifact</text>
  <text x="142" y="304" text-anchor="middle" class="s">twin.yaml · OpenUSD assets</text>

  <rect class="box" x="52" y="344" width="180" height="70" rx="12"/>
  <text x="142" y="372" text-anchor="middle" class="h">MQTT / IoT</text>
  <text x="142" y="392" text-anchor="middle" class="s">observed telemetry</text>

  <rect class="box" x="52" y="432" width="180" height="70" rx="12"/>
  <text x="142" y="460" text-anchor="middle" class="h">ConfigMap / URL</text>
  <text x="142" y="480" text-anchor="middle" class="s">artifactSource input</text>

  <text x="142" y="540" text-anchor="middle" class="s">Desired · Rendered · Observed</text>
  <text x="142" y="558" text-anchor="middle" class="tiny">THREE-WAY STATE</text>

  <!-- ============ CENTER: Control plane ============ -->
  <rect class="zone" x="280" y="120" width="520" height="460" rx="16" filter="url(#soft)" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="300" y="148" class="tiny">CONTROL PLANE</text>
  <text x="420" y="148" class="s">Kubernetes DigitalTwin CR · operator</text>

  <!-- DigitalTwin CR -->
  <rect class="boxCore" x="308" y="168" width="200" height="64" rx="12"/>
  <text x="408" y="194" text-anchor="middle" class="h">DigitalTwin CR</text>
  <text x="408" y="214" text-anchor="middle" class="s">where the artifact is</text>

  <!-- Materialize -->
  <rect class="box" x="532" y="168" width="240" height="64" rx="12"/>
  <text x="652" y="194" text-anchor="middle" class="h">Materialize</text>
  <text x="652" y="214" text-anchor="middle" class="s">atomic · nested paths · digest</text>

  <!-- Build row -->
  <rect class="boxAccent" x="308" y="260" width="220" height="88" rx="12"/>
  <text x="418" y="290" text-anchor="middle" class="h">Build isolation</text>
  <text x="418" y="312" text-anchor="middle" class="s">inline twinopsctl</text>
  <text x="418" y="330" text-anchor="middle" class="s">or Job · twinops-job</text>

  <rect class="box" x="552" y="260" width="220" height="88" rx="12"/>
  <text x="662" y="290" text-anchor="middle" class="h">Compose OpenUSD</text>
  <text x="662" y="312" text-anchor="middle" class="s">overlays · variants</text>
  <text x="662" y="330" text-anchor="middle" class="s">twinops:* attributes</text>

  <!-- Drift -->
  <rect class="boxWarn" x="308" y="376" width="464" height="72" rx="12"/>
  <text x="540" y="406" text-anchor="middle" class="h">Three-way drift engine</text>
  <text x="540" y="428" text-anchor="middle" class="s">Desired (Git/PLM)  ×  Rendered (USD)  ×  Observed (MQTT)  →  SYNCED / DRIFT / CRITICAL</text>

  <!-- Publish -->
  <rect class="boxOk" x="308" y="472" width="464" height="84" rx="12"/>
  <text x="540" y="502" text-anchor="middle" class="h">Immutable output publish</text>
  <text x="540" y="524" text-anchor="middle" class="s">bundle.tar.gz · content digest · revision history</text>
  <text x="540" y="542" text-anchor="middle" class="s">ConfigMap rN  ·  OCI  ·  S3/MinIO</text>

  <!-- Arrows inside control plane -->
  <path class="flow" d="M508 200 H532"/>
  <path class="flow" d="M408 232 V260"/>
  <path class="flow" d="M652 232 V260"/>
  <path class="flow" d="M418 348 V376"/>
  <path class="flow" d="M662 348 V376"/>
  <path class="flow" d="M540 448 V472"/>

  <!-- ============ RIGHT: Outputs / runtimes ============ -->
  <rect class="zone" x="828" y="120" width="260" height="460" rx="16" filter="url(#soft)"/>
  <text x="848" y="148" class="tiny">OUTPUTS &amp; RUNTIMES</text>

  <rect class="boxOk" x="848" y="168" width="220" height="78" rx="12"/>
  <text x="958" y="198" text-anchor="middle" class="h">status.output</text>
  <text x="958" y="218" text-anchor="middle" class="s">uri · digest · revision</text>
  <text x="958" y="234" text-anchor="middle" class="s">history[] for rollback</text>

  <rect class="box" x="848" y="268" width="220" height="70" rx="12"/>
  <text x="958" y="296" text-anchor="middle" class="h">Web control plane</text>
  <text x="958" y="316" text-anchor="middle" class="s">timeline · highlight · live API</text>

  <rect class="box" x="848" y="360" width="220" height="70" rx="12"/>
  <text x="958" y="388" text-anchor="middle" class="h">Omniverse Kit</text>
  <text x="958" y="408" text-anchor="middle" class="s">optional · highlight contract</text>

  <rect class="box" x="848" y="452" width="220" height="70" rx="12"/>
  <text x="958" y="480" text-anchor="middle" class="h">WebRTC / streaming</text>
  <text x="958" y="500" text-anchor="middle" class="s">lab · single-session sidecar</text>

  <text x="958" y="555" text-anchor="middle" class="tiny">OPTIONAL · NOT THE PRODUCT CENTER</text>

  <!-- Cross-zone arrows -->
  <path class="flow" d="M252 203 H308"/>
  <path class="flow" d="M252 291 H308"/>
  <path class="flow" d="M252 379 H300" opacity="0.0"/>
  <!-- MQTT to drift -->
  <path class="flowDashed" d="M232 379 C260 379 270 412 308 412"/>
  <!-- artifact to materialize -->
  <path class="flow" d="M232 467 C270 467 280 200 308 200"/>

  <path class="flow" d="M772 514 H848"/>
  <path class="flowDashed" d="M772 514 C800 514 810 303 848 303"/>
  <path class="flowDashed" d="M772 514 C800 514 810 395 848 395"/>
  <path class="flowDashed" d="M772 514 C800 514 810 487 848 487"/>

  <!-- Footer strip -->
  <rect x="32" y="604" width="1056" height="88" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="56" y="636" class="h">Control loop</text>
  <text x="56" y="660" class="t">Desired (Git / PLM)  →  Rendered (OpenUSD)  →  Observed (MQTT)  →  Drift  →  Proposal / rebuild  →  immutable output  →  SYNCED</text>
  <text x="56" y="680" class="s">Not claimed: multi-site plant platform · multi-user GPU farm · vendor PLM SDKs · automatic root-cause AI</text>

  <!-- Legend chips -->
  <rect x="820" y="624" width="12" height="12" rx="2" fill="#38bdf8"/>
  <text x="840" y="634" class="s">core path</text>
  <rect x="920" y="624" width="12" height="12" rx="2" fill="#64748b"/>
  <text x="940" y="634" class="s">optional</text>
  <rect x="1005" y="624" width="12" height="12" rx="2" fill="#f59e0b"/>
  <text x="1025" y="634" class="s">drift</text>
</svg>
